name: Supabase Keep-Alive

# Supabase pauses FREE projects after 7 days without any API activity.
# This workflow pings the project's REST API on a schedule so the project
# never counts as inactive. It is the GitHub half of a two-net setup —
# the other half is a local macOS crontab ping (see docs/operations.md).
#
# Every 2 days leaves a comfortable margin under the 7-day limit.
on:
  schedule:
    - cron: "0 6 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/products?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase ping: HTTP ${code}"
          if [ "$code" != "200" ]; then exit 1; fi